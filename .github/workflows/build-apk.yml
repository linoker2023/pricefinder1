name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Код проекта
        uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip ca-certificates \
            openjdk-17-jdk \
            autoconf automake libtool libltdl-dev \
            libffi-dev libssl-dev \
            build-essential cmake pkg-config \
            zlib1g-dev python3-dev \
            libxml2-dev libxslt1-dev

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: buildozer + cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install buildozer "cython==0.29.36"

      - name: Кэш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-subfolder-v2-${{ hashFiles('price_finder_UPLOAD/android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-subfolder-v2-

      - name: git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Сборка debug APK
        run: |
          set -o pipefail
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          cd price_finder_UPLOAD
          cp android/buildozer.spec ./buildozer.spec
          sed -i 's/^p4a\.branch = .*/p4a.version = 2024.1.0/' buildozer.spec
          sed -i '/^p4a\.fork/d' buildozer.spec
          buildozer --verbose android debug 2>&1 | tee build.log

      - name: Показать результат
        if: always()
        run: |
          ls -lh price_finder_UPLOAD/bin || true
          tail -n 200 price_finder_UPLOAD/build.log || true

      - name: Артефакт с APK
        uses: actions/upload-artifact@v4
        with:
          name: pricefinder-apk
          path: price_finder_UPLOAD/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Лог сборки (если упало)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: price_finder_UPLOAD/build.log
          retention-days: 14
