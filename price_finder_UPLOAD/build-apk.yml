# Что делает: собирает debug-APK приложения pricefinder и выкладывает его
# как артефакт, который можно скачать прямо из браузера и установить на телефон.
#
# Как пользоваться:
#   1) загрузите папку price_finder в свой репозиторий на GitHub;
#   2) вкладка «Actions» → «Сборка APK (Android)» → «Run workflow»;
#   3) через 20–40 минут в списке запусков откройте последний →
#      раздел «Artifacts» → скачайте pricefinder-apk → внутри файл .apk.
#
# Сборка также запускается автоматически при pushes в main/master
# и при изменении тегов вида v*.*.*

name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'gui_app.py'
      - 'price_finder.py'
      - 'pricefinder/**'
      - 'config/**'
      - 'android/buildozer.spec'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Код проекта
        uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip ca-certificates \
            openjdk-17-jdk \
            autoconf automake libtool libltdl-dev \
            libffi-dev libssl-dev \
            build-essential cmake pkg-config \
            zlib1g-dev python3-dev \
            libxml2-dev libxslt1-dev

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: buildozer + cython
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install buildozer "cython==0.29.36"

      - name: Кэш Android SDK/NDK и сборок python-for-android
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: git identity (нужен для python-for-android)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Подготовка spec-файла
        run: cp android/buildozer.spec ./buildozer.spec

      - name: Сборка debug APK
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          buildozer --verbose android debug 2>&1 | tee build.log

      - name: Показать результат
        if: always()
        run: |
          ls -lh bin/ || true
          tail -n 60 build.log || true

      - name: Артефакт с APK
        uses: actions/upload-artifact@v4
        with:
          name: pricefinder-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Лог сборки (если упало)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
